<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">iebox window illustration</title>
  <desc id="desc">An illustration of the iebox window: dark toolbar with navigation, address bar, Modern button and an emulation drop-down, a mock legacy intranet page, and a status bar with a Trident (legacy engine) badge. This is an illustration, not a screenshot.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="windowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161f"/>
      <stop offset="1" stop-color="#0e0e16"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
      .page-text { font-family: Verdana, Arial, Helvetica, sans-serif; }
      .icon { fill: none; stroke: #d7dbf0; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="750" fill="#07070c"/>
  <rect x="0" y="0" width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="250" cy="110" rx="420" ry="280" fill="url(#violetGlow)" filter="url(#softBlur)"/>
  <ellipse cx="1010" cy="680" rx="400" ry="260" fill="url(#cyanGlow)" filter="url(#softBlur)"/>

  <!-- illustration label -->
  <text x="1164" y="18" text-anchor="end" font-size="9.5" letter-spacing="2.4" fill="#9aa2c4" font-weight="600">ILLUSTRATION, NOT A SCREENSHOT</text>
  <text x="36" y="18" font-size="9.5" letter-spacing="2.4" fill="#5f668a" font-weight="600">IEBOX 0.1</text>

  <!-- window -->
  <g filter="url(#windowShadow)">
    <rect x="36" y="30" width="1128" height="690" rx="15" fill="url(#windowFill)" stroke="#2b2b3e" stroke-width="1"/>
  </g>
  <rect x="37" y="31" width="1126" height="2.5" fill="url(#accent)" opacity="0.95"/>

  <!-- title bar -->
  <circle cx="58" cy="52" r="4.6" fill="#ff5f57" opacity="0.85"/>
  <circle cx="74" cy="52" r="4.6" fill="#febc2e" opacity="0.85"/>
  <circle cx="90" cy="52" r="4.6" fill="#28c840" opacity="0.85"/>
  <text x="600" y="57" text-anchor="middle" font-size="12" fill="#a7adc7">Legacy intranet page - Northwind Manufacturing - iebox</text>
  <line x1="36" y1="64" x2="1164" y2="64" stroke="#242434"/>

  <!-- toolbar -->
  <rect x="36" y="64" width="1128" height="52" fill="#171722"/>
  <line x1="36" y1="116" x2="1164" y2="116" stroke="#242434"/>

  <!-- nav buttons -->
  <g>
    <rect x="52" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
    <rect x="88" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
    <rect x="124" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
    <rect x="160" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
  </g>
  <path class="icon" d="M69 83 L63 89 L69 95 M63 89 H75"/>
  <path class="icon" d="M105 83 L111 89 L105 95 M111 89 H99"/>
  <path class="icon" d="M133 84 A6 6 0 1 1 132 93 M133 79 V84 H138"/>
  <path class="icon" d="M168 89 L175 82 L182 89 M170 88 V96 H180 V88"/>

  <!-- address bar -->
  <rect x="204" y="74" width="536" height="30" rx="7" fill="#222234" stroke="#3a3a5a"/>
  <rect x="211" y="80" width="36" height="18" rx="4" fill="#2c2c44"/>
  <text x="229" y="93" text-anchor="middle" font-size="8.5" fill="#7dd3fc" class="mono">http</text>
  <text x="258" y="93" font-size="11.5" fill="#cdd2e8" class="mono">intranet.northwind.local/reports/2009/q3.html</text>

  <!-- Go / Modern -->
  <rect x="750" y="74" width="44" height="30" rx="6" fill="#7c3aed"/>
  <text x="772" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Go</text>
  <rect x="802" y="74" width="86" height="30" rx="6" fill="#12232b" stroke="#22d3ee" stroke-opacity="0.75"/>
  <text x="845" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#67e8f9">Modern</text>

  <!-- zoom -->
  <rect x="908" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
  <text x="923" y="94" text-anchor="middle" font-size="10" fill="#d7dbf0">A-</text>
  <text x="965" y="94" text-anchor="middle" font-size="10" fill="#a7adc7">100%</text>
  <rect x="992" y="74" width="30" height="30" rx="6" fill="#1f1f2e" stroke="#30304a"/>
  <text x="1007" y="94" text-anchor="middle" font-size="10" fill="#d7dbf0">A+</text>

  <!-- emulation -->
  <rect x="1036" y="74" width="114" height="30" rx="6" fill="#222234" stroke="#4b3a78"/>
  <circle cx="1050" cy="89" r="3" fill="#22d3ee"/>
  <text x="1060" y="93" font-size="10" fill="#d7dbf0">IE11</text>
  <path d="M1132 86 l4 4 4 -4" fill="none" stroke="#9aa2c4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- page -->
  <rect x="44" y="124" width="1112" height="556" fill="#f4f1e7"/>
  <rect x="44" y="124" width="1112" height="50" fill="#17365d"/>
  <text x="64" y="145" font-size="14" font-weight="700" letter-spacing="1.3" fill="#ffffff" class="page-text">NORTHWIND MANUFACTURING</text>
  <text x="64" y="162" font-size="8.5" fill="#cfe2ff" class="page-text">Employee Intranet&#160;&#160;|&#160;&#160;Document Library&#160;&#160;|&#160;&#160;Established 1994</text>
  <rect x="1056" y="137" width="78" height="20" rx="3" fill="#2f5b8f"/>
  <text x="1095" y="151" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dbeafe" class="page-text">INTRANET</text>

  <!-- sidebar -->
  <rect x="44" y="174" width="176" height="476" fill="#f8f6ee"/>
  <line x1="220" y1="174" x2="220" y2="650" stroke="#d8d2c0"/>
  <text x="62" y="198" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#17365d" class="page-text">NAVIGATION</text>
  <g font-size="10.5" fill="#003399" class="page-text">
    <text x="62" y="224">Quarterly reports</text>
    <text x="62" y="250">Forms and templates</text>
    <text x="62" y="276">Payroll portal</text>
    <text x="62" y="302">Phone directory</text>
    <text x="62" y="328">Vendor portal (new window)</text>
    <text x="62" y="354">Help desk</text>
  </g>
  <g stroke="#c9c2ae" stroke-width="1">
    <line x1="62" y1="234" x2="202" y2="234"/>
    <line x1="62" y1="260" x2="202" y2="260"/>
    <line x1="62" y1="286" x2="202" y2="286"/>
    <line x1="62" y1="312" x2="202" y2="312"/>
    <line x1="62" y1="338" x2="202" y2="338"/>
  </g>
  <text x="62" y="474" font-size="9" font-weight="700" fill="#666666" class="page-text">SYSTEM STATUS</text>
  <g font-size="9" fill="#666666" class="page-text">
    <text x="62" y="492">Payroll: online</text>
    <text x="62" y="508">ERP: online</text>
    <text x="62" y="524">Mail: maintenance</text>
  </g>

  <!-- ActiveX-style notice -->
  <rect x="240" y="188" width="888" height="54" fill="#fff6c8" stroke="#d6c25a"/>
  <circle cx="258" cy="207" r="8" fill="#e8d27a"/>
  <text x="258" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#6b5300">!</text>
  <text x="276" y="207" font-size="10" font-weight="700" fill="#3d3100" class="page-text">This website wants to run the following add-on: "LegacyPayroll Control"</text>
  <text x="276" y="222" font-size="9" fill="#5b4a00" class="page-text">From "Northwind Systems". If you trust the website and the add-on, click Allow.</text>
  <rect x="1004" y="199" width="48" height="20" rx="3" fill="#f3e6a8" stroke="#b9a44e"/>
  <text x="1028" y="212" text-anchor="middle" font-size="8.5" fill="#3d3100" class="page-text">Allow</text>
  <rect x="1058" y="199" width="58" height="20" rx="3" fill="#f3e6a8" stroke="#b9a44e"/>
  <text x="1087" y="212" text-anchor="middle" font-size="8.5" fill="#3d3100" class="page-text">Risk?</text>

  <!-- content heading -->
  <text x="240" y="277" font-size="21" font-weight="700" fill="#111111" class="page-text">Legacy intranet page</text>
  <text x="240" y="296" font-size="9" fill="#666666" class="page-text">Last published: 14 October 2009 by the Intranet Services team</text>

  <!-- engine badge -->
  <rect x="240" y="308" width="236" height="22" rx="11" fill="#e6f4ea" stroke="#9ed3ad"/>
  <circle cx="254" cy="319" r="3" fill="#1a7f37"/>
  <text x="264" y="323" font-size="9" fill="#1a5c2e" class="page-text">Engine: Trident, document mode 11</text>
  <text x="492" y="323" font-size="9" fill="#777777" class="page-text">- verified by the demo page</text>

  <!-- reports table -->
  <rect x="240" y="344" width="888" height="26" fill="#d9e2f3"/>
  <line x1="240" y1="344" x2="1128" y2="344" stroke="#9aa8c4"/>
  <line x1="240" y1="370" x2="1128" y2="370" stroke="#9aa8c4"/>
  <g font-size="9" font-weight="700" fill="#17365d" class="page-text">
    <text x="248" y="361">Document</text>
    <text x="548" y="361">Period</text>
    <text x="688" y="361">Format</text>
    <text x="818" y="361">Owner</text>
    <text x="948" y="361">Status</text>
  </g>

  <g class="page-text" font-size="9">
    <rect x="240" y="370" width="888" height="26" fill="#ffffff"/>
    <text x="248" y="387" fill="#003399">Q3 2009 manufacturing summary</text>
    <text x="548" y="387" fill="#1b1b1b">Jul - Sep 2009</text>
    <text x="688" y="387" fill="#1b1b1b">Excel 97-2003</text>
    <text x="818" y="387" fill="#1b1b1b">j.smith</text>
    <text x="948" y="387" fill="#1b1b1b">Final</text>

    <rect x="240" y="396" width="888" height="26" fill="#f7f6f1"/>
    <text x="248" y="413" fill="#003399">Q3 2009 cost centre reconciliation</text>
    <text x="548" y="413" fill="#1b1b1b">Jul - Sep 2009</text>
    <text x="688" y="413" fill="#1b1b1b">Excel 97-2003</text>
    <text x="818" y="413" fill="#1b1b1b">m.jones</text>
    <text x="948" y="413" fill="#1b1b1b">Final</text>

    <rect x="240" y="422" width="888" height="26" fill="#ffffff"/>
    <text x="248" y="439" fill="#003399">Q2 2009 inventory adjustment</text>
    <text x="548" y="439" fill="#1b1b1b">Apr - Jun 2009</text>
    <text x="688" y="439" fill="#1b1b1b">Word 97-2003</text>
    <text x="818" y="439" fill="#1b1b1b">a.patel</text>
    <text x="948" y="439" fill="#1b1b1b">Archived</text>

    <rect x="240" y="448" width="888" height="26" fill="#f7f6f1"/>
    <text x="248" y="465" fill="#003399">Q1 2009 payroll audit</text>
    <text x="548" y="465" fill="#1b1b1b">Jan - Mar 2009</text>
    <text x="688" y="465" fill="#1b1b1b">PDF 1.4</text>
    <text x="818" y="465" fill="#1b1b1b">r.chen</text>
    <text x="948" y="465" fill="#1b1b1b">Archived</text>
  </g>

  <g stroke="#b9c3d6" stroke-width="1">
    <line x1="240" y1="396" x2="1128" y2="396"/>
    <line x1="240" y1="422" x2="1128" y2="422"/>
    <line x1="240" y1="448" x2="1128" y2="448"/>
    <line x1="240" y1="474" x2="1128" y2="474"/>
    <line x1="240" y1="474" x2="240" y2="344"/>
    <line x1="540" y1="344" x2="540" y2="474"/>
    <line x1="680" y1="344" x2="680" y2="474"/>
    <line x1="810" y1="344" x2="810" y2="474"/>
    <line x1="940" y1="344" x2="940" y2="474"/>
    <line x1="1128" y1="344" x2="1128" y2="474"/>
  </g>

  <!-- lower page content -->
  <text x="240" y="502" font-size="9.5" font-weight="700" fill="#a00000" class="page-text">[ UNDER CONSTRUCTION ]</text>
  <text x="382" y="502" font-size="9" fill="#777777" class="page-text">The new intranet launches in Q2 2010.</text>

  <rect x="240" y="520" width="888" height="26" fill="#ece9dc" stroke="#d5d0bf"/>
  <text x="248" y="537" font-size="9" fill="#5c5748" class="page-text">Reminder: the payroll cut-off for October is Friday at 17:00. Contact the help desk on extension 4400.</text>

  <text x="240" y="582" font-size="9" fill="#666666" class="page-text">Engine badge, tables, &#60;font&#62; markup and the ActiveX notice all come from docs/demo/legacy-page.html.</text>
  <text x="240" y="600" font-size="9" fill="#666666" class="page-text">Use it to verify that the real Trident engine is doing the rendering.</text>

  <!-- page footer -->
  <rect x="44" y="650" width="1112" height="30" fill="#f3f1e8"/>
  <line x1="44" y1="650" x2="1156" y2="650" stroke="#cfc9b8"/>
  <text x="62" y="669" font-size="8.5" fill="#555555" class="page-text">&#169; 2009 Northwind Manufacturing. Internal use only.</text>
  <text x="1138" y="669" text-anchor="end" font-size="8.5" fill="#555555" class="page-text">Best viewed in Internet Explorer 8 at 1024 x 768</text>

  <!-- status bar -->
  <rect x="36" y="680" width="1128" height="40" fill="#101018"/>
  <line x1="36" y1="680" x2="1164" y2="680" stroke="#26263a"/>
  <rect x="48" y="690" width="172" height="20" rx="4" fill="#5b21b6"/>
  <text x="134" y="704" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">Trident (legacy engine)</text>
  <text x="234" y="704" font-size="9.5" fill="#a7adc7">Done</text>
  <text x="1152" y="704" text-anchor="end" font-size="9" fill="#7c84a4" class="mono">http &#183; not encrypted</text>
  <text x="1034" y="704" text-anchor="end" font-size="9" fill="#7c84a4" class="mono">IE11</text>

  <!-- footer note -->
  <text x="600" y="742" text-anchor="middle" font-size="9" letter-spacing="1.4" fill="#5f668a">iebox &#183; github.com/arifs122/iebox &#183; MIT</text>
</svg>
